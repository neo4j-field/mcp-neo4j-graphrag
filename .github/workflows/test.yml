name: Retrieval tests
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv run python -m unittest discover -s tests/unit -v
  integration:
    strategy:
      matrix:
        neo4j: ['5.26-community', '2026.09.0-community']
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:${{ matrix.neo4j }}
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      NEO4J_MCP_RUN_INTEGRATION: '1'
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv run python -m unittest discover -s tests/integration -v
